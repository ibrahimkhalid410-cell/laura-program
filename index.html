<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Laura · 30 Minuten · Coach Ibrahim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700;1,9..144,500&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5EFE6; --paper:#FFFFFF; --ink:#2A2230; --muted:#6E6475; --line:#E3D8C8; --soft:#F1E8DA;
  --plum:#3E2A4F; --plum-ink:#F7F0E6; --sand:#C99A4B; --sand2:#E8CC94;
  --la:#C08A33; --up:#6B4C8A; --lb:#B5654A; --pp:#4F8573; --good:#3F7D5C; --warn:#B0661A; --wa:#25D366; --focus:#6B4C8A;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#17121C; --paper:#211A28; --ink:#EEE6F2; --muted:#A99DB2; --line:#382E42; --soft:#2A2233;
    --plum:#2B1E38; --plum-ink:#F2E9DC; --la:#E0AE58; --up:#A587C6; --lb:#DC876A; --pp:#77B39C; --good:#6FBF92; --warn:#E2A94A; --focus:#A587C6;
  }
}
:root[data-theme="dark"]{
  --bg:#17121C; --paper:#211A28; --ink:#EEE6F2; --muted:#A99DB2; --line:#382E42; --soft:#2A2233;
  --plum:#2B1E38; --plum-ink:#F2E9DC; --la:#E0AE58; --up:#A587C6; --lb:#DC876A; --pp:#77B39C; --good:#6FBF92; --warn:#E2A94A; --focus:#A587C6;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.5}
h1,h2,h3,h4{font-family:"Fraunces",Georgia,"Times New Roman",serif;margin:0;line-height:1.1;font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
.muted{color:var(--muted)}
.sig{font-family:"Fraunces",Georgia,serif;font-style:italic}

/* hero */
.hero{background:var(--plum);color:var(--plum-ink);padding:18px 0 26px;position:relative;overflow:hidden}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.lang{display:flex;background:rgba(255,255,255,.1);border-radius:999px;padding:3px}
.lang button{border:0;background:transparent;color:var(--plum-ink);padding:5px 12px;border-radius:999px;font-weight:700;font-size:.82rem;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--sand);color:#2A1E10}
.hero-main{margin-top:14px}
.name{font-family:"Fraunces",Georgia,serif;font-weight:700;font-size:clamp(3.6rem,15vw,7rem);letter-spacing:.06em;line-height:.95;margin:0;
  background:linear-gradient(180deg,#F6E3B8 0%,#D9AE62 55%,#B07F33 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.tagline{font-family:"Fraunces",Georgia,serif;font-style:italic;font-weight:500;font-size:clamp(1.25rem,4vw,1.7rem);margin:8px 0 0}
.forline{margin:6px 0 0;opacity:.85;font-size:.98rem}
.forline b{color:var(--sand2);display:inline-block;min-width:5ch}
.forline b.swap{animation:swap .5s ease both}
@keyframes swap{from{opacity:0;transform:translateY(50%)}to{opacity:1;transform:none}}
.start{margin-top:16px;border:0;border-radius:999px;padding:13px 22px;font-weight:700;font-size:1rem;cursor:pointer;background:var(--sand);color:#2A1E10;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.start:hover{background:var(--sand2)}
.scene-wrap{margin-top:18px}
#scene{display:block;width:100%;height:190px;border-radius:18px;box-shadow:0 0 0 1px rgba(255,255,255,.08)}
.scene-lbl{margin:8px 2px 0;font-size:.85rem;font-weight:600;color:var(--plum-ink);opacity:.92;text-align:center}

/* sticky tabs + timer */
.bar{position:sticky;top:0;z-index:40;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.tabs{display:flex;gap:4px;padding:8px 0}
.tabs button{flex:1;border:0;background:transparent;padding:9px 4px;border-radius:10px;font-weight:600;font-size:.9rem;cursor:pointer;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 0 var(--line),0 2px 8px rgba(0,0,0,.06)}
.timer{display:none;align-items:center;gap:10px;padding:0 0 8px;font-size:.9rem}
.timer.on{display:flex}
.timer .tbar{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.timer .tbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--sand2),var(--sand))}
.timer b{font-variant-numeric:tabular-nums}
.timer button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 12px;font-weight:600;cursor:pointer;font-size:.82rem}

section.view{display:none;padding:18px 0 110px}
section.view.on{display:block}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:12px}
.card h3{font-size:1.2rem;margin-bottom:8px}
.hint{color:var(--muted);font-size:.9rem;margin:0 0 10px}

/* weeks + days */
.weeks{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:.85rem}
.weeks .lbl{font-weight:700;margin-right:4px}
.wk{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--line);background:var(--paper);font-weight:700;cursor:pointer;font-size:.85rem;display:grid;place-items:center}
.wk.cur{background:var(--plum);color:var(--plum-ink);border-color:var(--plum)}
.wk.dl{border-style:dashed}
.wk.counted::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--sand);position:absolute;transform:translateY(14px)}
.nextblock{border:0;background:var(--sand);color:#2A1E10;border-radius:999px;padding:6px 12px;font-weight:700;cursor:pointer;font-size:.82rem}
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.day{border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:9px 10px;text-align:left;cursor:pointer;position:relative}
.day b{display:block;font-size:.95rem}
.day small{color:var(--muted);font-size:.75rem;display:block;line-height:1.25}
.day[aria-pressed="true"]{border-color:var(--c);box-shadow:inset 0 -4px 0 var(--c)}
.day .tick{position:absolute;top:6px;right:8px;color:var(--good);font-weight:800;font-size:.85rem}

/* cycle band */
.cycle{display:flex;gap:2px;margin-top:8px}
.cycle i{flex:1;height:8px;border-radius:2px;background:var(--line)}
.cycle i.p{background:#D9718A}
.cycle i.o{background:#E8CC94}
.cycle i.t{outline:2px solid var(--ink);outline-offset:1px}
.cyclemsg{border-left:5px solid #D9718A}
.toggle{display:flex;align-items:center;gap:10px;margin-top:10px;font-weight:600;cursor:pointer}
.toggle input{width:20px;height:20px;accent-color:#D9718A}

/* check-in */
.faces{display:flex;gap:6px;flex-wrap:wrap}
.faces button{font-size:1.6rem;width:48px;height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);cursor:pointer;line-height:1}
.faces button[aria-pressed="true"]{border-color:var(--sand);background:var(--soft);transform:scale(1.08)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 14px;font-weight:600;cursor:pointer;font-size:.9rem}
.chips button[aria-pressed="true"]{border-color:var(--plum);background:var(--plum);color:var(--plum-ink)}
.q{margin:14px 0 6px;font-weight:700;font-size:.95rem}
.range{display:flex;align-items:center;gap:10px}
.range input{flex:1;accent-color:var(--plum)}
.range output{font-weight:800;min-width:2ch;text-align:right}
.btn{border:0;background:var(--plum);color:var(--plum-ink);border-radius:999px;padding:11px 18px;font-weight:700;cursor:pointer;font-size:.95rem}
.btn.sand{background:var(--sand);color:#2A1E10}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.mode{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--soft);border-radius:12px;padding:10px 12px;margin-top:12px;font-size:.92rem}
.mode b{font-weight:700}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:.85rem}

/* session */
.sec-title{display:flex;justify-content:space-between;align-items:baseline;margin:20px 0 4px}
.sec-title h3{font-size:1.15rem}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mini .m{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center;font-size:.82rem}
.mini .mlink{display:block;margin-top:4px;font-size:.75rem;font-weight:700;color:var(--c);text-decoration:none}
.mini svg{width:100%;height:auto;max-width:120px;display:block;margin:0 auto 4px;background:var(--bg);border-radius:8px}
.block{background:var(--paper);border:1px solid var(--line);border-radius:16px;margin-top:12px;overflow:hidden;border-top:5px solid var(--c)}
.block-h{display:flex;justify-content:space-between;align-items:center;padding:10px 14px 0;font-size:.8rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.ex{display:grid;grid-template-columns:120px 1fr;gap:12px;padding:12px 14px;border-top:1px dashed var(--line)}
.ex:first-of-type{border-top:0}
.ex .fig svg{width:120px;height:100px;background:var(--bg);border-radius:10px;display:block}
.ex .fig a{display:block;text-align:center;font-size:.75rem;font-weight:700;color:var(--c);text-decoration:none;margin-top:4px}
.ex h4{font-family:"Figtree",sans-serif;font-size:1.02rem;font-weight:700}
.tag{display:inline-block;font-size:.68rem;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--soft);margin-left:6px;vertical-align:2px;font-family:"Figtree",sans-serif}
.rx{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:4px;font-size:.88rem}
.rx em{font-style:normal;color:var(--muted)}
.cue{margin:6px 0 0;font-size:.86rem;color:var(--muted)}
.note{margin:6px 0 0;font-size:.82rem;font-weight:700;color:var(--c)}
.memo{margin-top:8px;padding:7px 10px;border:1px dashed var(--c);border-radius:10px;font-size:.84rem;display:flex;flex-wrap:wrap;gap:4px 12px}
.memo .tgt{color:var(--c);font-weight:700}
.log{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.log label{display:flex;align-items:center;gap:5px;font-size:.82rem;color:var(--muted)}
.log input{width:70px;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.rir{display:flex;gap:3px;align-items:center;font-size:.78rem;color:var(--muted)}
.rir button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-weight:700;cursor:pointer;font-size:.8rem}
.rir button[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}
.done{border:1.5px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;background:transparent;font-weight:700;font-size:.82rem;margin-left:auto}
.done[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}
.ex.is-done h4{text-decoration:line-through;text-decoration-color:var(--c);text-decoration-thickness:2px}
.song{border:0;background:var(--soft);border-radius:999px;padding:5px 11px;font-weight:700;font-size:.8rem;cursor:pointer;margin-top:8px}
.after .stars{display:flex;gap:4px}
.after .stars button{font-size:1.6rem;background:none;border:0;cursor:pointer;color:var(--line);padding:0 2px}
.after .stars button.on{color:var(--sand)}
textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);resize:vertical;font-size:.92rem}
.wa{background:var(--wa)!important;color:#073B1E!important}

/* forms */
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--muted);font-weight:600}
.field input,.field select{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:.98rem;width:100%}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.mfield{border:1px solid var(--line);border-radius:12px;padding:8px;display:grid;grid-template-columns:56px 1fr;gap:8px;align-items:center;background:var(--bg)}
.mfield svg{width:56px;height:70px;display:block;background:var(--paper);border-radius:8px}
.mfield label{font-size:.8rem;font-weight:700;display:flex;flex-direction:column;gap:3px;min-width:0;overflow-wrap:anywhere}
.mfield input{padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--paper);width:100%}
.tbl{overflow-x:auto;margin-top:12px}
table{border-collapse:collapse;width:100%;font-size:.86rem;min-width:520px}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:600}
tr.chg td{font-weight:800;border-bottom:0}
.up{color:var(--good)} .down{color:var(--lb)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.stat{background:var(--soft);border-radius:12px;padding:12px}
.stat strong{display:block;font-family:"Fraunces",Georgia,serif;font-size:1.5rem;line-height:1.1}
.stat span{font-size:.8rem;color:var(--muted)}
.supps{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.supp{border:1.5px solid var(--line);border-radius:12px;padding:9px 10px;background:var(--bg);font-size:.86rem}
.supp.on{border-color:var(--sand);background:var(--soft)}
.supp b{display:block}
.supp .qty{display:flex;align-items:center;gap:6px;margin-top:6px}
.supp .qty button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--paper);cursor:pointer;font-weight:800}
.list{margin:0;padding:0;list-style:none}
.list li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:.92rem}
.list li:last-child{border-bottom:0}

/* progress */
.prwall{display:flex;flex-direction:column;gap:6px}
.pr{display:flex;align-items:center;gap:10px;background:linear-gradient(90deg,rgba(232,204,148,.35),transparent);border-radius:10px;padding:8px 10px;font-size:.9rem}
.pr .grain{width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#FBEBC4,#C99A4B);flex:0 0 auto}
.pr small{color:var(--muted);margin-left:auto}
.chart{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.8rem;margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.dots{display:flex;gap:8px;flex-wrap:wrap}
.dots span{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);font-weight:700;font-size:.85rem}
.dots span.ok{background:var(--sand);border-color:var(--sand);color:#2A1E10}
.share3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.share3 button{border:0;border-radius:12px;padding:12px 6px;font-weight:800;cursor:pointer;background:var(--wa);color:#073B1E;font-size:.95rem}
.share3 small{display:block;font-weight:600;font-size:.72rem;opacity:.8}

/* floating whatsapp + toast + celebration */
.fab{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:50;display:flex;align-items:center;gap:8px;background:var(--wa);color:#073B1E;border-radius:999px;padding:10px 14px;font-weight:800;text-decoration:none;box-shadow:0 6px 18px rgba(0,0,0,.2);font-size:.9rem}
.fab svg{width:22px;height:22px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(74px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:.85rem;font-weight:600;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
.coachmsg{position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);z-index:65;width:min(92vw,420px);display:flex;gap:12px;align-items:flex-start;background:var(--plum);color:var(--plum-ink);border-radius:16px;padding:12px 14px;box-shadow:0 10px 28px rgba(30,20,38,.35);opacity:0;pointer-events:none;transition:opacity .3s, transform .35s cubic-bezier(.2,.9,.3,1.2);cursor:pointer}
.coachmsg.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.coachmsg .av{flex:0 0 auto;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-family:"Fraunces",Georgia,serif;font-weight:700;font-size:1.1rem;background:linear-gradient(180deg,#F6E3B8,#C99A4B);color:#2A1E10}
.coachmsg p{margin:0;font-size:.95rem;line-height:1.4;font-weight:500}
.coachmsg .sig{display:block;margin-top:3px;font-size:.88rem;color:var(--sand2)}
.celebrate{position:fixed;inset:0;z-index:80;display:none;place-items:center;background:rgba(30,20,38,.55);overflow:hidden}
.celebrate.on{display:grid}
.celebrate .box{background:var(--paper);border-radius:20px;padding:24px 22px;text-align:center;max-width:320px;position:relative;z-index:2;animation:pop .45s cubic-bezier(.2,.9,.3,1.3) both}
.celebrate h2{font-size:2rem;color:var(--sand)}
.celebrate p{margin:6px 0}
.celebrate .big{font-weight:800;font-size:1.1rem}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
.grainfall{position:absolute;top:-20px;width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#FFF1CC,#C99A4B);animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
footer{margin-top:30px;color:var(--muted);font-size:.85rem;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
footer .sig{font-size:1.05rem;color:var(--ink)}

@media (max-width:620px){
  #scene{height:170px}
  .start{padding:12px 16px}
  .days{grid-template-columns:repeat(2,1fr)}
  .ex{grid-template-columns:96px 1fr}
  .ex .fig svg{width:96px;height:80px}
  .fab span{display:none}
  .fab{padding:12px}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="hero">
  <div class="wrap">
    <div class="hero-top">
      <span class="sig">Coach Ibrahim</span>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="de">DE</button><button type="button" data-lang="en">EN</button>
      </div>
    </div>
    <div class="hero-main">
      <div>
        <h1 class="name">LAURA</h1>
        <p class="tagline" data-t="tagline"></p>
        <p class="forline"><span data-t="todayFor"></span> <b id="rotWord"></b></p>
        <button class="start" type="button" id="startBtn"><span aria-hidden="true">⏳</span><span data-t="start30"></span></button>
      </div>
    </div>
    <div class="scene-wrap">
      <canvas id="scene" aria-hidden="true"></canvas>
      <p class="scene-lbl" id="trailLbl" role="status"></p>
    </div>
    <div>

    </div>
  </div>
</header>

<div class="bar">
  <div class="wrap">
    <nav class="tabs" role="tablist">
      <button type="button" role="tab" data-tab="train" data-t="tabTrain"></button>
      <button type="button" role="tab" data-tab="info" data-t="tabInfo"></button>
      <button type="button" role="tab" data-tab="food" data-t="tabFood"></button>
      <button type="button" role="tab" data-tab="prog" data-t="tabProg"></button>
    </nav>
    <div class="timer" id="timer"><span aria-hidden="true">⏱</span><b id="tTime">0:00</b><span class="muted" style="flex:1" data-t="yourTime"></span><button type="button" id="tStop" data-t="finish"></button></div>
  </div>
</div>

<main class="wrap">
  <section class="view" id="v-train"></section>
  <section class="view" id="v-info"></section>
  <section class="view" id="v-food"></section>
  <section class="view" id="v-prog"></section>

<script>
const FIG = (function(){
const L = {torso:28, neck:8, headR:6, ua:15, fa:14, th:20, sh:20, foot:7};
const rad = a => a*Math.PI/180;
const dir = a => [Math.cos(rad(a)), -Math.sin(rad(a))];
const add = (p,v,k=1) => [p[0]+v[0]*k, p[1]+v[1]*k];
const lerp = (a,b,s) => a+(b-a)*s;
const r1 = v => Math.round(v*10)/10;

function ik(root, target, l1, l2, pref){
  let dx=target[0]-root[0], dy=target[1]-root[1], d=Math.hypot(dx,dy)||0.001;
  let tx=target[0], ty=target[1];
  const maxd=l1+l2-0.05, mind=Math.abs(l1-l2)+0.5;
  if(d>maxd){ tx=root[0]+dx/d*maxd; ty=root[1]+dy/d*maxd; d=maxd; }
  if(d<mind){ tx=root[0]+dx/d*mind; ty=root[1]+dy/d*mind; d=mind; }
  const ux=(tx-root[0])/d, uy=(ty-root[1])/d;
  const a=(l1*l1-l2*l2+d*d)/(2*d), h=Math.sqrt(Math.max(0,l1*l1-a*a));
  const mx=root[0]+ux*a, my=root[1]+uy*a;
  const jb=[mx-uy*h, my+ux*h], jf=[mx+uy*h, my-ux*h];
  let j;
  switch(pref){
    case "f": j=jf; break; case "b": j=jb; break;
    case "u": j = jf[1]<jb[1]?jf:jb; break; case "d": j = jf[1]>jb[1]?jf:jb; break;
    case "l": j = jf[0]<jb[0]?jf:jb; break; case "r": j = jf[0]>jb[0]?jf:jb; break;
    default: j=jf;
  }
  return [j,[tx,ty]];
}

function base(p, front){
  const hip=p.h, td=dir(p.t), neck=add(hip,td,L.torso);
  const head=add(neck,dir(p.hd??p.t),L.neck);
  let sN,sF,hN,hF;
  if(front){ sN=[neck[0]+6,neck[1]+3]; sF=[neck[0]-6,neck[1]+3]; hN=[hip[0]+5,hip[1]]; hF=[hip[0]-5,hip[1]]; }
  else { sN=sF=add(neck,td,-3); hN=hF=hip; }
  return {hip,neck,head,td,sN,sF,hN,hF};
}
function world(spec, b, p){
  if(!Array.isArray(spec)) return null;
  const [x,y,,fr]=spec;
  if(fr==="n") return [b.neck[0]+x, b.neck[1]+y];
  if(fr==="h") return [b.hip[0]+x, b.hip[1]+y];
  if(fr==="t"){ const u=b.td, v=dir(p.t-90); return [b.hip[0]+u[0]*x+v[0]*y, b.hip[1]+u[1]*x+v[1]*y]; }
  return [x,y];
}

function solve(fig, s){
  const A=fig.k[0], B=fig.k[1];
  const bA=base(A,fig.front), bB=base(B,fig.front);
  const p={h:[lerp(A.h[0],B.h[0],s), lerp(A.h[1],B.h[1],s)], t:lerp(A.t,B.t,s), hd:lerp(A.hd??A.t, B.hd??B.t, s)};
  const b=base(p,fig.front);
  const J={hip:b.hip, neck:b.neck, head:b.head};
  const limbs=[["aN","sN","eN","wN",L.ua,L.fa],["aF","sF","eF","wF",L.ua,L.fa],["lN","hN","kN","fN",L.th,L.sh],["lF","hF","kF","fF",L.th,L.sh]];
  for(const [key,root,mid,end,l1,l2] of limbs){
    const sa=A[key], sb=B[key], r=b[root];
    J[root+"_"]=r;
    if(sa && sa.a){
      const u=lerp(sa.a[0],sb.a[0],s), l=lerp(sa.a[1],sb.a[1],s);
      const m=add(r,dir(u),l1); J[mid]=m; J[end]=add(m,dir(l),l2);
    } else if(sa){
      const ta=world(sa,bA,A), tb=world(sb,bB,B);
      const t=[lerp(ta[0],tb[0],s), lerp(ta[1],tb[1],s)];
      const pref = (s<0.5?sa:sb)[2];
      const [m,e]=ik(r,t,l1,l2,pref); J[mid]=m; J[end]=e;
      if(key[0]==="l"){
        const fa = sa[4]!=null ? lerp(sa[4], (sb[4]??sa[4]), s) : (fig.front ? (key==="lN"?0:180) : 0);
        J["t"+key[1]] = add(e, dir(fa), fig.front?4:L.foot);
      }
    }
    J[root]=r;
  }
  return J;
}

function render(fig, s, col){
  const J=solve(fig,s);
  const P = (...pts)=>"M"+pts.map(q=>r1(q[0])+" "+r1(q[1])).join(" L");
  const farOp = fig.mono ? 1 : 0.42;
  let back="", front="";
  if(!fig.nofloor) back += `<line x1="4" y1="92.5" x2="116" y2="92.5" stroke="${col.muted}" stroke-width="1.2" opacity=".6"/>`;
  for(const pr of fig.props||[]){
    if(pr.r) back += `<rect x="${pr.r[0]}" y="${pr.r[1]}" width="${pr.r[2]}" height="${pr.r[3]}" rx="2.5" fill="${col.soft}" stroke="${col.muted}" stroke-width="1"/>`;
    else if(pr.l) back += `<line x1="${pr.l[0]}" y1="${pr.l[1]}" x2="${pr.l[2]}" y2="${pr.l[3]}" stroke="${col.muted}" stroke-width="${pr.w||3}" stroke-linecap="round"/>`;
    else if(pr.c) back += `<circle cx="${pr.c[0]}" cy="${pr.c[1]}" r="${pr.c[2]}" fill="${col.soft}" stroke="${col.muted}" stroke-width="1"/>`;
    else if(pr.cable){ const a=J[pr.cable]; back += `<line x1="${r1(a[0])}" y1="${r1(a[1])}" x2="${pr.to[0]}" y2="${pr.to[1]}" stroke="${col.muted}" stroke-width="1.2"/>`; }
    else if(pr.plat){ const a=J[pr.plat], d=dir(pr.ang), h=(pr.len||24)/2; front += `<line x1="${r1(a[0]-d[0]*h)}" y1="${r1(a[1]-d[1]*h)}" x2="${r1(a[0]+d[0]*h)}" y2="${r1(a[1]+d[1]*h)}" stroke="${col.muted}" stroke-width="4" stroke-linecap="round"/>`; }
    else if(pr.pad){ const a=J[pr.pad]; front += `<circle cx="${r1(a[0]+(pr.dx||0))}" cy="${r1(a[1]+(pr.dy||0))}" r="${pr.rr||4}" fill="${col.muted}"/>`; }
    else if(pr.db){ const a=J[pr.db]; const far = pr.db.endsWith("F") && !fig.mono; const g=`<rect x="${r1(a[0]-5)}" y="${r1(a[1]-2.6)}" width="10" height="5.2" rx="2.4" fill="${col.c}" opacity="${far?0.5:1}"/>`; if(far) back+=g; else front+=g; }
    else if(pr.plate){ const a=J[pr.plate]; front += `<circle cx="${r1(a[0]+(pr.dx||0))}" cy="${r1(a[1]+(pr.dy||0))}" r="${pr.rr||8}" fill="${col.c}" opacity=".9"/><circle cx="${r1(a[0]+(pr.dx||0))}" cy="${r1(a[1]+(pr.dy||0))}" r="1.6" fill="${col.paper}"/>`; }
    else if(pr.bar){ const a=J[pr.bar], h=(pr.len||16)/2; front += `<line x1="${r1(a[0]-h)}" y1="${r1(a[1])}" x2="${r1(a[0]+h)}" y2="${r1(a[1])}" stroke="${col.c}" stroke-width="3" stroke-linecap="round"/>`; }
    else if(pr.band){ const a=J[pr.band[0]], b2=J[pr.band[1]]; front += `<line x1="${r1(a[0])}" y1="${r1(a[1])}" x2="${r1(b2[0])}" y2="${r1(b2[1])}" stroke="${col.c}" stroke-width="2.2"/>`; }
    else if(pr.ball){ const a=J[pr.ball]; front += `<circle cx="${r1(a[0]+3)}" cy="${r1(a[1]-2)}" r="${pr.rr||6}" fill="${col.c}"/>`; }
  }
  const limb=(r,m,e,t,op,w)=>`<path d="${P(...[J[r],J[m],J[e]].concat(t&&J[t]?[J[t]]:[]))}" fill="none" stroke="${col.ink}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" opacity="${op}"/>`;
  let fig_="";
  if(fig.glow){ fig_ += `<circle cx="${r1(J.hip[0])}" cy="${r1(J.hip[1])}" r="9" fill="${col.c}" opacity=".28"/>`; }
  fig_ += limb("hF","kF","fF","tF",farOp,4.6) + limb("sF","eF","wF",null,farOp,4.2);
  fig_ += `<path d="${P(J.hip,J.neck)}" stroke="${col.ink}" stroke-width="6" stroke-linecap="round"/>`;
  fig_ += `<line x1="${r1(J.neck[0])}" y1="${r1(J.neck[1])}" x2="${r1(J.head[0])}" y2="${r1(J.head[1])}" stroke="${col.ink}" stroke-width="3.5" stroke-linecap="round"/><circle cx="${r1(J.head[0])}" cy="${r1(J.head[1])}" r="${L.headR}" fill="${col.ink}"/>`;
  const nearLimbs = limb("hN","kN","fN","tN",1,4.6) + limb("sN","eN","wN",null,1,4.2);
  // far-hand props sit between far and near layers; near props on top
  return back + fig_ + nearLimbs + front;
}

/* ---------------- state ---------------- */
const DEF = {profile:{sex:"",age:"",height:"",weight:"",activity:"",goal:"",song:""}, cycle:{start:"",len:"",plen:"",off:false},
  measures:[], supps:{qty:{}, custom:[]}, meds:[], medsInReport:false, sessions:{}, prs:[],
  ui:{lang:(navigator.language||"de").toLowerCase().startsWith("de")?"de":"en", tab:"train", block:1, week:1, day:"la", theme:""}};
let S;
try{ S = JSON.parse(localStorage.getItem(LS)||"null"); }catch(e){ S=null; }
S = deepMerge(structuredCloneSafe(DEF), S||{});
function structuredCloneSafe(o){ return JSON.parse(JSON.stringify(o)); }
function deepMerge(a,b){ for(const k in b){ if(b[k] && typeof b[k]==="object" && !Array.isArray(b[k]) && a[k] && typeof a[k]==="object" && !Array.isArray(a[k])) deepMerge(a[k],b[k]); else a[k]=b[k]; } return a; }

/* ---------------- helpers ---------------- */
const $ = (s,el=document)=>el.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => { const n=parseFloat(String(v??"").replace(",",".")); return isFinite(n)?n:null; };
const fmt = v => (Math.round(v*10)/10).toLocaleString(S.ui.lang==="de"?"de-DE":"en-US");
const roundTo = (v,s)=>Math.max(s,Math.round(v/s)*s);
const DAYMS = 86400000;
const parseDay = s => { const m=String(s||"").match(/^(\d{4})-(\d{2})-(\d{2})$/); return m?new Date(+m[1],+m[2]-1,+m[3]):null; };
const today0 = () => { const n=new Date(); return new Date(n.getFullYear(),n.getMonth(),n.getDate()); };
const iso = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const niceDate = d => d.toLocaleDateString(S.ui.lang==="de"?"de-DE":"en-US",{day:"numeric",month:"short"});
const reduce = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
function toast(msg){ const el=$("#toast"); el.textContent=msg; el.classList.add("on"); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove("on"),1600); }
function waOpen(text){ const url="https://wa.me/"+WA+"?text="+encodeURIComponent(text); const a=document.createElement("a"); a.href=url; a.target="_blank"; a.rel="noopener"; document.body.appendChild(a); a.click(); a.remove(); }
const topOf = r => { const n=String(N(r)).match(/\d+/g); return n?Number(n[n.length>1?1:0]):null; };
const botOf = r => { const n=String(N(r)).match(/\d+/g); return n?Number(n[0]):null; };

/* ---------------- cycle ---------------- */
function cycleInfo(){
  if(S.profile.sex!=="female" || S.cycle.off) return null;
  const st=parseDay(S.cycle.start); if(!st) return null;
  const len=Math.min(45,Math.max(20,num(S.cycle.len)||28)), pl=Math.min(10,Math.max(2,num(S.cycle.plen)||5));
  const diff=Math.floor((today0()-st)/DAYMS); if(diff<0) return null;
  const d=(diff%len)+1, ov=len-14;
  const phase = d<=pl ? "phMen" : d<ov-1 ? "phFol" : d<=ov+1 ? "phOv" : "phLut";
  return {d,len,pl,ov,phase,inPeriod:d<=pl};
}
function cycleBand(ci){ let h='<div class="cycle" aria-hidden="true">'; for(let i=1;i<=ci.len;i++){ h+=`<i class="${i<=ci.pl?"p":(Math.abs(i-ci.ov)<=1?"o":"")}${i===ci.d?" t":""}"></i>`; } return h+"</div>"; }

/* ---------------- sessions ---------------- */
const skey = () => `${S.ui.block}-${S.ui.week}-${S.ui.day}`;
function sess(create){ const k=skey(); if(!S.sessions[k] && create) S.sessions[k]={ex:{}}; return S.sessions[k]; }
function sessionCtx(){
  const s=sess(false)||{}, ci=s.checkin||{}, day=DAYS[S.ui.day];
  return {week:S.ui.week, energy:ci.energy||"high", period:!!ci.period, back:day.lower?(+ci.back||0):0, light:!!day.light, short:ci.energy==="low"};
}
function exFor(e, ctx){ return (ctx.back>3 && e.alt) ? {...e, ...e.alt, alt:null, swapped:true} : e; }
function presc(e, ctx){
  let sets=e.sets;
  if(e.main && ctx.week>=3 && ctx.week<=5) sets++;
  if(ctx.week===6) sets=Math.max(2,sets-1);
  if(ctx.period) sets=Math.max(2,sets-1);
  if(ctx.short) sets=Math.min(sets,2);
  const rir = (ctx.week===6||ctx.period) ? "3" : ctx.light ? "2–3" : ctx.energy==="high" ? "1–2" : "2–3";
  return {sets, rir};
}
function allEntries(id){ // chronological entries for an exercise across sessions
  const out=[]; for(const k in S.sessions){ const en=S.sessions[k].ex?.[id]; if(en && num(en.w)!=null && num(en.r)!=null) out.push({...en,k}); }
  return out.sort((a,b)=>(a.t||0)-(b.t||0));
}
function lastBefore(id){ const k=skey(); const list=allEntries(id).filter(e=>e.k!==k); return list[list.length-1]||null; }
function suggestion(e, ctx){
  if(e.unit==="bw") { const l=lastBefore(e.id); return l?{last:l}:{}; }
  const l=lastBefore(e.id);
  if(!l){ if(e.start) return {tgt:t("startG",{w:fmt(e.start)})+(e.per?" "+N(e.per):"")}; return {tgt:t("firstTime")}; }
  const w=num(l.w), r=num(l.r), top=topOf(e.reps), rir=l.rir;
  if(ctx.week===6) return {last:l, tgt:t("dl",{w:fmt(roundTo(w*0.9,e.step||1))})};
  if(ctx.energy!=="high"||ctx.period) return {last:l, tgt:t("keep",{w:fmt(w)})};
  if((top && r>=top) || rir==="3") return {last:l, tgt:t("goUp",{w:fmt(w+(e.inc||2.5))}), up:true};
  return {last:l, tgt:t("stay",{w:fmt(w),r:Math.min(top||r+1, r+1)})};
}

/* ---------------- figures ---------------- */
const figVis=new Set(); let figObs=null, colCache=new WeakMap();
function figColors(svg){ const cs=getComputedStyle(svg), g=v=>cs.getPropertyValue(v).trim(); return {ink:g("--ink")||"#2A2230",soft:g("--soft")||"#F1E8DA",muted:g("--muted")||"#6E6475",c:g("--c")||"#C99A4B",paper:g("--paper")||"#fff"}; }
function drawFig(svg,s){ const f=FIG.F[svg.dataset.fig]; if(!f) return; let c=colCache.get(svg); if(!c){ c=figColors(svg); colCache.set(svg,c); } svg.innerHTML=FIG.render(f,s,c); }
function initFigs(root){
  colCache=new WeakMap();
  const svgs=root.querySelectorAll("svg[data-fig]");
  if(figObs) figObs.disconnect(); figVis.clear();
  svgs.forEach(s=>drawFig(s,reduce()?1:0));
  if(reduce()) return;
  if("IntersectionObserver" in window){ figObs=new IntersectionObserver(es=>es.forEach(e=>e.isIntersecting?figVis.add(e.target):figVis.delete(e.target))); svgs.forEach(s=>figObs.observe(s)); }
  else svgs.forEach(s=>figVis.add(s));
}
let lastF=0;
function loop(now){ requestAnimationFrame(loop); tickTimer(); if(!reduce() && now-(loop._s||0)>40){ loop._s=now; paintScene(now); } if(now-lastF<33||reduce()) return; lastF=now; let i=0;
  figVis.forEach(svg=>{ const tt=now/1000/2.8+(i++)*0.13, raw=(1-Math.cos(2*Math.PI*tt))/2, x=Math.min(1,Math.max(0,(raw-0.08)/0.84)); drawFig(svg,x*x*(3-2*x)); }); }
requestAnimationFrame(loop);

  return `<svg viewBox="34 2 52 94" aria-hidden="true">${body}<ellipse cx="${E[0]}" cy="${E[1]}" rx="${E[2]}" ry="${E[3]}" fill="none" stroke="${g("--sand")||"#C99A4B"}" stroke-width="3.2" stroke-dasharray="3.5 2"/></svg>`;
}

function weekCounted(b,w){ let n=0; for(const k in S.sessions){ const [kb,kw]=k.split("-"); if(+kb===b&&+kw===w&&isDone(S.sessions[k])) n++; } return n>=2; }
function isDone(s){ if(!s) return false; if(s.after?.at) return true; const ids=Object.keys(s.ex||{}); return ids.filter(i=>s.ex[i].done).length>=3; }

    h+=`<button type="button" class="day" data-day="${id}" aria-pressed="${id===S.ui.day}" style="--c:var(${d.c})"><b>${esc(N(d.name))}</b><small>${esc(N(d.sub))}</small>${done?'<span class="tick">✓</span>':""}</button>`; });
  h+=`</div>`;
  if(ci){ h+=`<div class="card${ci.inPeriod?" cyclemsg":""}"><div style="display:flex;justify-content:space-between;gap:8px;font-size:.88rem;font-weight:700"><span>${t("cycleDay",{d:ci.d,p:t(ci.phase)})}</span></div>${cycleBand(ci)}${ci.inPeriod?`<p style="margin:8px 0 0;font-size:.9rem">${esc(t("periodMsg",{d:ci.d}))}</p>`:""}</div>`; }
  // check-in
  if(!s || !s.checkin){
    const pre = s?.draft || {};
    h+=`<div class="card" id="checkin" style="--c:var(${day.c})"><h3>${t("checkTitle")}</h3>
      <p class="q">${t("moodQ")}</p><div class="faces" data-q="mood">${["😣","🙁","😐","🙂","😄"].map((f,i)=>`<button type="button" data-v="${i+1}" aria-pressed="${pre.mood==i+1}" aria-label="${i+1}/5">${f}</button>`).join("")}</div>
      <p class="q">${t("energyQ")}</p><div class="chips" data-q="energy">${[["high","eHigh"],["ok","eOk"],["low","eLow"]].map(([k,l])=>`<button type="button" data-v="${k}" aria-pressed="${pre.energy===k}">${t(l)}</button>`).join("")}</div>
      ${day.lower?`<p class="q">${t("backQ")}</p><div class="range"><input type="range" min="0" max="10" step="1" value="${pre.back??0}" id="backR" aria-label="${t("backQ")}"><output id="backO">${pre.back??0}</output></div>`:""}
      ${ci&&ci.inPeriod?`<label class="toggle"><input type="checkbox" id="perT"${pre.period?" checked":""}> ${t("lighter")}</label>`:""}
      <div style="margin-top:14px"><button type="button" class="btn" id="buildBtn"${pre.mood&&pre.energy?"":" disabled"}>${t("build")}</button></div></div>`;
    v.innerHTML=h; bindTrain(); return;
  }
  // mode summary
  const lines=[ctx.short?t("mLow"):ctx.energy==="ok"?t("mOk"):t("mHigh")];
  if(ctx.period) lines.push(t("mPeriod")); if(ctx.week===6) lines.push(t("mDeload")); if(ctx.back>3) lines.push(t("mBack"));
  h+=`<div class="mode"><span>${lines.map(esc).join("<br>")}</span><button type="button" class="linkbtn" id="redo">${t("change")}</button></div>`;

    h+=`<div class="block" style="--c:var(${day.c})"><div class="block-h"><span>${letter} · ${blk.length>1?t("superset"):t("single")}</span></div>`;

          <div class="rx"><span><em>${t("sets")}</em> ${p.sets}</span><span><em>${t("reps")}</em> ${esc(N(e.reps))}</span>${e.rest&&e.rest!=="—"?`<span><em>${t("rest")}</em> ${esc(e.rest)}</span>`:""}${e.unit!=="bw"?`<span><em>${t("effort")}</em> ${p.rir}</span>`:""}</div>
          <p class="cue">${esc(N(e.cue))}</p>${e.note&&!sg.last?`<p class="note">${esc(N(e.note))}</p>`:""}
          ${(sg.last||sg.tgt)?`<div class="memo">${sg.last?`<span><b>${t("lastTime")}:</b> ${sg.last.w?fmt(num(sg.last.w))+" kg × ":""}${esc(sg.last.r)}${sg.last.rir!=null?" · RIR "+esc(sg.last.rir):""}</span>`:""}${sg.tgt?`<span class="tgt">${esc(sg.tgt)}</span>`:""}</div>`:""}

        </div>

          ${e.unit==="bw"?"":`<label>${t("kg")} <input type="text" inputmode="decimal" data-f="w" value="${esc(en.w)}" aria-label="${esc(nm)} kg"></label>`}
          <label>${t("repsIn")} <input type="text" inputmode="numeric" data-f="r" value="${esc(en.r)}" aria-label="${esc(nm)} ${t("repsIn")}"></label>

  // after card
  const a=s.after||{};

function checkPR(id){

  const cur=e1(w,r);
  const existing=S.prs.findIndex(p=>p.k===skey()&&p.id===id);
  if(cur>best+0.01){
    const rec={id,k:skey(),w,r,at:Date.now()};
    if(existing>=0) S.prs[existing]=rec; else { S.prs.push(rec); celebrate(rec); }

    for(let i=0;i<4;i++){ const sp=still?0:now/90; const x=((i*W*0.27+sp*(0.6+i*0.1))%(W+40))-20, y=hy*(0.25+0.12*i)+(still?0:Math.sin(now/400+i)*3), w=6+i; const fl=still?0:Math.sin(now/120+i)*2;
      g.beginPath(); g.moveTo(x-w,y-fl); g.quadraticCurveTo(x-w/2,y-3,x,y); g.quadraticCurveTo(x+w/2,y-3,x+w,y-fl); g.stroke(); } }
  // unlock 6: finish arch at the horizon
  if(n>=18){ const k=grow(scene.unlockAt[18],now,1000), u=0.97, x=CX(u), y=Y(u), aw=Math.max(26,RW(0.8)*1.4)*k, ah=aw*0.75;
    g.strokeStyle="#FFF4DE"; g.lineWidth=2; g.beginPath(); g.moveTo(x-aw/2,y); g.lineTo(x-aw/2,y-ah); g.moveTo(x+aw/2,y); g.lineTo(x+aw/2,y-ah); g.stroke();
    g.fillStyle="#E8B65C"; g.fillRect(x-aw/2-2,y-ah-8,aw+4,9); g.fillStyle="#2A1D38"; g.font=`700 ${Math.max(6,7*k)}px Figtree, sans-serif`; g.textAlign="center"; g.fillText("✓ 6",x,y-ah-1.5);
    if(!still) for(let s=0;s<18;s++){ const a=(now/1000+s)%3/3; g.fillStyle=["#F6B8C3","#FFE08A","#B99BDB","#8FCDB4"][s%4]; g.fillRect(x-aw+((s*37)%(aw*2)), y-ah-10+a*(H-y+ah), 2.5, 2.5); } }
}

function drawChart(){
  const svg=$("#chart"); if(!svg) return; const css=getComputedStyle(document.documentElement), col=v=>v.startsWith("--")?css.getPropertyValue(v).trim():v;
  const series=ANCHORS.map(([id,c])=>({id,c:col(c),pts:allEntries(id).map(e=>({t:e.t||0,v:e1(num(e.w),num(e.r))}))})).filter(s=>s.pts.length);
  const Wd=640,H=240,L=40,R=12,Tp=12,B=24; let out="";
  if(!series.length){ svg.innerHTML=`<text x="320" y="120" text-anchor="middle" font-size="15" fill="${css.getPropertyValue("--muted")}">${esc(t("noLift"))}</text>`; $("#legend").innerHTML=""; return; }
  const allT=series.flatMap(s=>s.pts.map(p=>p.t)), allV=series.flatMap(s=>s.pts.map(p=>p.v));
  const t0=Math.min(...allT), t1=Math.max(...allT)||t0+1; let lo=Math.min(...allV), hi=Math.max(...allV); if(hi-lo<10){lo=Math.max(0,lo-5);hi+=5;}
  const x=tt=>L+(t1===t0?0.5:(tt-t0)/(t1-t0))*(Wd-L-R), y=v=>Tp+(hi-v)*(H-Tp-B)/(hi-lo);
  for(let k=0;k<=4;k++){ const vv=lo+(hi-lo)*k/4; out+=`<line x1="${L}" x2="${Wd-R}" y1="${y(vv)}" y2="${y(vv)}" stroke="${css.getPropertyValue("--line")}"/><text x="${L-6}" y="${y(vv)+4}" text-anchor="end" font-size="11" fill="${css.getPropertyValue("--muted")}">${Math.round(vv)}</text>`; }
  series.forEach(s=>{ const pts=s.pts.map(p=>[x(p.t),y(p.v)]); if(pts.length>1) out+=`<polyline fill="none" stroke="${s.c}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" points="${pts.map(p=>p.join(",")).join(" ")}"/>`; pts.forEach(p=>out+=`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="${css.getPropertyValue("--paper")}" stroke="${s.c}" stroke-width="2.4"/>`); });
  svg.innerHTML=out; $("#legend").innerHTML=series.map(s=>`<span><i style="background:${s.c}"></i>${esc(N(ALLEX[s.id].name))}</span>`).join("");
}

function reportToday(){

function reportRange(days){

  const moods=ks.map(k=>S.sessions[k].checkin?.mood).filter(Boolean); if(moods.length) L.push(`${t("avgMood")}: ${MOODS[Math.round(moods.reduce((a,b)=>a+b,0)/moods.length)]}`);
  const en=ks.map(k=>S.sessions[k].checkin?.energy).filter(Boolean); if(en.length) L.push(`${t("avgEnergy")}: ${["high","ok","low"].map(x=>`${t({high:"eHigh",ok:"eOk",low:"eLow"}[x])} ${en.filter(e=>e===x).length}×`).join(", ")}`);
  const prs=S.prs.filter(p=>p.at>=since); L.push(`🏆 ${t("prsW")}: ${prs.length?prs.map(p=>`${N(ALLEX[p.id].name)} ${p.w} kg × ${p.r}`).join("; "):t("none")}`);
  const st=stalledList(); L.push(`⚠️ ${t("stalled")}: ${st.length?st.join(", "):t("none")}`);
  if(days>7){ const ms=[...S.measures].sort((a,b)=>String(a.date).localeCompare(String(b.date))); if(ms.length>1){ const f=ms[0], l=ms[ms.length-1]; L.push("📏 "+["weight","waist","hips","glutes"].map(c=>{ const a=num(f[c]), b=num(l[c]); return a!=null&&b!=null?`${t(c).replace(/ \(.*\)/,"")} ${b-a>=0?"+":""}${fmt(b-a)}`:""; }).filter(Boolean).join(", ")); } }
  if(S.medsInReport&&S.meds.length) L.push("💊 "+S.meds.map(m=>m.name+(m.note?" ("+m.note+")":"")).join(", "));
  L.push("");
  ks.slice(-8).forEach(k=>L.push(...sessLines(k,S.sessions[k])));
  return L.join("\n");
}

/* ---------------- shell ---------------- */
function go(tab){ S.ui.tab=tab; save(); document.querySelectorAll(".tabs [data-tab]").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===tab)); document.querySelectorAll("section.view").forEach(s=>s.classList.toggle("on",s.id==="v-"+tab)); if(tab==="train") initFigs($("#v-train")); if(tab==="prog") drawChart(); }
document.querySelectorAll(".tabs [data-tab]").forEach(b=>b.onclick=()=>{ go(b.dataset.tab); window.scrollTo({top:$(".bar").offsetTop,behavior:reduce()?"auto":"smooth"}); });
document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{ S.ui.lang=b.dataset.lang; save(); renderAll(); });
function applyText(){ document.documentElement.lang=S.ui.lang; document.querySelectorAll("[data-t]").forEach(el=>el.textContent=t(el.dataset.t)); document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===S.ui.lang)); $("#fab").href="https://wa.me/"+WA+"?text="+encodeURIComponent(t("waHello")); rotIdx=0; $("#rotWord").textContent=T[S.ui.lang].words[0]; }
let rotIdx=0; setInterval(()=>{ if(reduce()) return; const w=T[S.ui.lang].words; rotIdx=(rotIdx+1)%w.length; const el=$("#rotWord"); el.classList.remove("swap"); void el.offsetWidth; el.textContent=w[rotIdx]; el.classList.add("swap"); },2800);
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change",()=>{ renderInfo(); initFigs($("#v-train")); drawChart(); });
function renderAll(){ applyText(); renderTrain(); renderInfo(); renderFood(); renderProg(); go(S.ui.tab||"train"); updateHG(); }
renderAll();
})();
</script>
